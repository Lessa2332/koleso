    <style>
        :root {
            --accent-primary: #C9A96E;

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-deep); color: var(--text-primary); }

        #video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }

        .top-bar { position: absolute; top: max(18px, env(safe-area-inset-top, 18px)); left: 18px; right: 18px; display: flex; justify-content: space-between; z-index: 200; gap: 12px; }

        /* FIX: піднято вище, щоб не перекриватися з підписом */
        #video-controls { position: absolute; bottom: max(100px, calc(env(safe-area-inset-bottom, 0px) + 80px)); left: 0; right: 0; display: none; justify-content: center; gap: 16px; z-index: 300; padding: 0 20px; }
        #video-controls button { background: rgba(18, 18, 28, 0.8); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 12px 24px; border-radius: 60px; font-weight: 500; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        #video-controls button.pause-btn { background: #1A1A28; border: 1px solid var(--accent-primary); color: var(--accent-soft); min-width: 130px; }

        #loading { position: fixed; inset: 0; background: radial-gradient(circle at 30% 40%, #1A1A28, #0B0B12); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: var(--accent-soft); padding: 24px; }
        #loading.visible { display: flex; }
        #loading-title { font-size: 1.7rem; font-weight: 600; letter-spacing: 0.2em; margin-bottom: 40px; text-transform: uppercase; color: #E6D3B3; }
        .load-step { display: flex; align-items: center; gap: 16px; padding: 10px 0; font-size: 15px; color: rgba(230, 211, 179, 0.4); }
        .load-step.active { color: #F5F5F0; font-weight: 500; }
        .load-step.done { color: var(--accent-primary); }
        .pbwrap { width: 100%; max-width: 320px; background: rgba(255, 255, 255, 0.06); border-radius: 30px; height: 6px; margin-top: 28px; overflow: hidden; }
        .pb { height: 100%; background: linear-gradient(90deg, #8C6E3F, #C9A96E); width: 0%; transition: width 0.35s ease; }

        #setup-screen { position: fixed; inset: 0; background: radial-gradient(circle at 50% 10%, #13131F, #09090F); display: flex; flex-direction: column; align-items: center; z-index: 999; padding: max(24px, env(safe-area-inset-top)) 20px; overflow-y: auto; }
        .setup-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; margin: auto 0; }
        @media (min-width: 900px) { .setup-container { max-width: 1040px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; } .setup-header { text-align: left; } }
        .setup-header { text-align: center; margin-bottom: 20px; }
        .setup-header .logo { font-size: 0.85rem; letter-spacing: 0.3em; color: var(--accent-soft); text-transform: uppercase; opacity: 0.7; }
        .setup-header h1 { font-size: clamp(1.3rem, 5vw, 1.8rem); font-weight: 700; margin-top: 4px; }
        .setup-author { font-size: 12px; color: rgba(230, 211, 179, 0.6); margin-top: 10px; }

        .wizard-progress { display: flex; gap: 6px; margin-bottom: 20px; }
        .wizard-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.15); }
        .wizard-dot.active { background: var(--accent-primary); width: 20px; border-radius: 3px; }

        .wizard-step { display: none; width: 100%; }
        .wizard-step.active { display: block; }
        .step-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; text-align: center; }
        @media (min-width: 900px) { .step-title { text-align: left; } }

        .drop-zone { border: 1.5px dashed rgba(255, 255, 255, 0.25); border-radius: 18px; padding: 32px 20px; text-align: center; margin-bottom: 10px; background: rgba(255, 255, 255, 0.02); cursor: pointer; }

        /* FIX: додано label для полів */
        .field-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
        #video-url, #event-meta input, #event-title { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 14px 20px; border-radius: 60px; width: 100%; font-size: 16px; /* FIX: 16px запобігає auto-zoom на iOS */ margin-bottom: 10px; outline: none; }
        .toggle-box { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; color: var(--text-secondary); }

        .setup-buttons button { flex: 1; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 14px; border-radius: 60px; font-size: 15px; cursor: pointer; text-transform: uppercase; }
        .setup-buttons button.primary { background: #1E1E2A; border-color: var(--accent-primary); }
        #upload-status { font-size: 13px; text-align: center; margin-bottom: 8px; min-height: 18px; }

        #qrcode-wrapper { display: none; text-align: center; margin-top: 10px; }
        #qrcode-wrapper.visible { display: block; }
        #qrcode-container { padding: 16px; background: white; border-radius: 18px; display: inline-block; }

        .footer { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 10px; color: rgba(255,255,255,0.3); }

        /* FIX: підпис піднято вище контролів */
        #ar-caption { position: absolute; bottom: max(200px, calc(env(safe-area-inset-bottom, 0px) + 170px)); left: 20px; right: 20px; z-index: 200; display: none; text-align: center; pointer-events: none; }

        #step-card { background: rgba(12, 12, 20, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(201, 169, 110, 0.4); border-radius: 28px; padding: 30px 24px; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7); }
        #step-emoji { font-size: 64px; margin-bottom: 8px; animation: pulseSoft 2s infinite; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(20, 20, 30, 0.95); border: 1px solid var(--accent-primary); color: #fff; padding: 12px 22px; border-radius: 40px; font-size: 14px; z-index: 2000; opacity: 0; transition: all 0.3s; pointer-events: none; }
        .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

        @keyframes pulseSoft { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.95); } }

        #unmute-btn { position: absolute; top: max(80px, calc(env(safe-area-inset-top, 0px) + 60px)); left: 50%; transform: translateX(-50%); z-index: 350; background: var(--accent-primary); color: #000; padding: 12px 24px; border-radius: 30px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none; text-transform: uppercase; }
        #unmute-btn.visible { display: block; animation: pulseSoft 2s infinite; }
    </style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ar-caption">
    <div id="ar-caption-title"></div>
    <div id="ar-caption-date"></div>
</div>

<div id="setup-screen">
    <div class="setup-container">

                <div class="wizard-dot" data-dot="1"></div>

            </div>

                <div class="wizard-step active" data-step="0">
                    <div class="step-title">Додайте відео</div>
                    <div class="drop-zone" id="drop-zone">

                <div class="wizard-step" data-step="2">

                    <div id="qrcode-wrapper">
                        <div id="qrcode-container"></div>
                        <div id="qr-meta-block" style="margin-top:10px;font-size:12px;"></div>
                    </div>
                    <div class="setup-buttons" style="margin-top: 20px;">
                        <button id="prev-2">←</button>
                        <button id="go-ar-btn" class="primary">Запустити AR</button>

    </div>
    <div class="footer">© 2026 <a href="https://github.com/lessa2332" target="_blank" style="color:#C9A96E;text-decoration:none;">Олеся Бохонок</a> · SmartLessa</div>

<div class="top-bar" id="ar-topbar" style="display:none;">

<div id="video-controls">
    <button id="restart-btn">Спочатку</button>
    <button id="pause-btn" class="pause-btn">Пауза</button>

<div id="onboarding">
    <div id="step-card">
        <div id="step-emoji">🖐️</div>

        <div id="step-title">Покажіть долоню</div>

    </div>

<div class="toast" id="toast"></div>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';

    const WORKER_URL = 'https://ar-videoo.23lessa32.workers.dev';
    const safeStorage = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
    const trackEvent = (name, data = {}) => { try { if (window.cfBeacon?.trackEvent) window.cfBeacon.trackEvent(name, data); if (typeof gtag === 'function') gtag('event', name, data); } catch(e) {} };

    function sanitizeUrl(str) { try { const u = new URL(str.trim(), window.location.href); return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : ''; } catch { return ''; } }
    function getParams() { const p = new URLSearchParams(window.location.search); return { video: sanitizeUrl(p.get('video')), chroma: p.get('chroma') !== '0', title: decodeURIComponent(p.get('title') || ''), date: p.get('date') || '', time: p.get('time') || '' }; }
    const params = getParams();

    function formatCaptionDate(d, t) { if (!d) return ''; try { const dt = new Date(d + (t ? 'T' + t : '')); return dt.toLocaleDateString('uk-UA', { day: '2-digit', month: 'long', year: 'numeric' }) + (t ? ' • ' + t : ''); } catch { return d; } }
    function showToast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('visible'); setTimeout(() => el.classList.remove('visible'), 2500); }

    function initSetup() {
        const urlInput = document.getElementById('video-url');
        const fileInput = document.getElementById('video-file-input');
        const dropZone = document.getElementById('drop-zone');
        const uploadStatus = document.getElementById('upload-status');
        const titleInput = document.getElementById('event-title');
        const dateInput = document.getElementById('event-date');
        const timeInput = document.getElementById('event-time');
        const qrWrapper = document.getElementById('qrcode-wrapper');

        const now = new Date();
        dateInput.value = now.toISOString().split('T')[0];
        timeInput.value = now.toTimeString().slice(0, 5);
        if (safeStorage.get('lastTitle')) titleInput.value = safeStorage.get('lastTitle');
        titleInput.addEventListener('input', () => safeStorage.set('lastTitle', titleInput.value));

        let currentStep = 0;
        const steps = document.querySelectorAll('.wizard-step');
        const dots = document.querySelectorAll('.wizard-dot');

        function goStep(n) {
            currentStep = Math.max(0, Math.min(2, n));
            steps.forEach((s, i) => s.classList.toggle('active', i === currentStep));
            dots.forEach((d, i) => { d.classList.toggle('active', i === currentStep); d.style.background = i < currentStep ? 'var(--accent-primary)' : ''; });
            if (currentStep === 2) refreshQr();
        }

        function buildLink() {
            const url = sanitizeUrl(urlInput.value.trim()); if (!url) return '';
            return `${window.location.origin}${window.location.pathname}?video=${encodeURIComponent(url)}&chroma=${document.getElementById('chromakey-toggle').checked ? '1' : '0'}&title=${encodeURIComponent(titleInput.value)}&date=${dateInput.value}&time=${timeInput.value}`;
        }

        function refreshQr() {
            const link = buildLink(); if (!link) return;
            const container = document.getElementById('qrcode-container');
            container.innerHTML = '';
            new QRCode(container, { text: link, width: 160, height: 160, colorDark: "#0B0B12", colorLight: "#FFFFFF" });
            document.getElementById('qr-meta-block').innerHTML = `<strong>${titleInput.value || 'AR Studio'}</strong>`;
            qrWrapper.classList.add('visible');
        }

        document.getElementById('next-1').onclick = () => { if (!sanitizeUrl(urlInput.value.trim())) return showToast('Спочатку додайте відео'); goStep(1); };
        document.getElementById('prev-1').onclick = () => goStep(0);
        document.getElementById('next-2').onclick = () => goStep(2);
        document.getElementById('prev-2').onclick = () => goStep(1);
        document.getElementById('go-ar-btn').onclick = () => { const l = buildLink(); if (l) window.location.href = l; };

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const f = e.target.files[0]; if (!f) return;
            uploadStatus.textContent = 'Завантаження...';
            const xhr = new XMLHttpRequest(); const fd = new FormData(); fd.append('file', f);
            xhr.upload.onprogress = (ev) => { if (ev.lengthComputable) uploadStatus.textContent = `Завантаження ${Math.round((ev.loaded / ev.total) * 100)}%`; };
            xhr.onload = () => { try { const d = JSON.parse(xhr.responseText); if (d.url) { urlInput.value = d.url; uploadStatus.textContent = '✅ Готово'; } } catch { uploadStatus.textContent = '❌ Помилка'; } };
            xhr.open('POST', WORKER_URL); xhr.send(fd);
        };
    }

    async function initAR() {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('loading').classList.add('visible');
        document.getElementById('ar-topbar').style.display = 'flex';
        trackEvent('ar_started');

        const debugInfo = document.getElementById('debug-info');
        const videoEl = document.getElementById('video'), canvasEl = document.getElementById('canvas');
        const hVideo = document.createElement('video');
        hVideo.setAttribute('playsinline', ''); hVideo.setAttribute('crossorigin', 'anonymous');
        hVideo.muted = true; hVideo.loop = false; hVideo.src = params.video; hVideo.load();

        if (params.title || params.date) {
            document.getElementById('ar-caption').style.display = 'block';
            if (params.title) document.getElementById('ar-caption-title').textContent = params.title;
            if (params.date) document.getElementById('ar-caption-date').textContent = '📅 ' + formatCaptionDate(params.date, params.time);
        }

        const scene = new THREE.Scene();
        const cam3 = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        cam3.position.set(0, 0, 3.2);
        const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, alpha: true, antialias: true });
        renderer.setClearColor(0, 0);
        // FIX: обмеження pixel ratio для слабких гаджетів
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        window.addEventListener('resize', () => { cam3.aspect = window.innerWidth / window.innerHeight; cam3.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        const hologramGroup = new THREE.Group(); scene.add(hologramGroup);
        const vTex = new THREE.VideoTexture(hVideo);

        const hMat = new THREE.ShaderMaterial({
            uniforms: { uTex: { value: vTex }, uPlaying: { value: 0 }, uChroma: { value: params.chroma ? 1.0 : 0.0 } },
            vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `
                uniform sampler2D uTex; uniform float uPlaying; uniform float uChroma; varying vec2 vUv;
                vec3 rgb2hsv(vec3 c){ vec4 K=vec4(0.,-1./3.,2./3.,-1.); vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g)); vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r)); float d=q.x-min(q.w,q.y); float e=1e-10; return vec3(abs(q.z+(q.w-q.y)/(6.*d+e)),d/(q.x+e),q.x); }
                void main(){
                    if(uPlaying < 0.5) discard;
                    vec4 col = texture2D(uTex, vUv);
                    if(uChroma > 0.5){
                        vec3 hsv = rgb2hsv(col.rgb); float hDeg = hsv.x * 360.0;
                        if(hDeg > 75.0 && hDeg < 170.0 && hsv.y > 0.24 && hsv.z > 0.08) discard;
                        float edgeMask = 1.0;
                        if(hDeg > 70.0 && hDeg < 175.0 && hsv.y > 0.14 && hsv.z > 0.06){ edgeMask = 1.0 - smoothstep(0.14, 0.28, hsv.y); if(edgeMask < 0.05) discard; }
                        gl_FragColor = vec4(col.rgb, edgeMask);
                    } else { gl_FragColor = col; }
                }`,
            transparent: true, side: THREE.DoubleSide, depthWrite: false
        });

        const hPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.825), hMat);
        hPlane.position.y = 0.35; hologramGroup.add(hPlane);
        hVideo.addEventListener('loadedmetadata', () => { const asp = hVideo.videoWidth / hVideo.videoHeight || 1.33; hPlane.scale.set(1, 1 / asp * (4/3), 1); });

        // FIX: замінено 15 Mesh-частинок на THREE.Points (1 draw call)
        const particleCount = 15;
        const pGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const pMat = new THREE.PointsMaterial({ color: 0xC9A96E, size: 0.02, transparent: true, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(pGeo, pMat);
        particles.userData = { angles: [], radii: [], speeds: [] };
        for (let i = 0; i < particleCount; i++) {
            particles.userData.angles.push((i / particleCount) * Math.PI * 2);
            particles.userData.radii.push(0.65);
            particles.userData.speeds.push(0.3 + Math.random() * 0.4);
        }
        hologramGroup.add(particles);
        scene.add(new THREE.AmbientLight(0xffffff, 1));

        let hologramActive = false, isPaused = false;

        let facingMode = 'user';
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode } });
                videoEl.srcObject = stream; await videoEl.play();
                videoEl.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'none';
                return { ok: true, stream };
            } catch (e) {
                // FIX: розрізняємо причини помилки
                let reason = 'unknown';
                if (e.name === 'NotAllowedError') reason = 'denied';
                else if (e.name === 'NotFoundError') reason = 'notfound';
                else if (e.name === 'NotReadableError') reason = 'busy';
                return { ok: false, reason };
            }
        }

        // FIX: активація без камери — показуємо відео в центрі
        function activateWithoutCamera(reason) {
            hologramActive = true;
            hologramGroup.visible = true;
            hologramGroup.position.set(0, 0.35, 0);
            document.getElementById('onboarding').classList.remove('visible');
            hVideo.muted = false;
            hVideo.play().then(() => {
                hMat.uniforms.uPlaying.value = 1;
                document.getElementById('video-controls').style.display = 'flex';
                debugInfo.innerHTML = reason === 'denied' ? 'Камеру відхилено — відео по центру' : 'Камера недоступна — відео по центру';
            }).catch(() => {
                hVideo.muted = true;
                hVideo.play();
                hMat.uniforms.uPlaying.value = 1;
                document.getElementById('video-controls').style.display = 'flex';
                document.getElementById('unmute-btn').classList.add('visible');
                debugInfo.innerHTML = 'Відео без звуку (камера недоступна)';
            });
        }

        document.getElementById('camera-toggle').onclick = async () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            const r = await startCamera();
            if (!r.ok) showToast('Не вдалося перемкнути камеру');
        };
        document.getElementById('reset').onclick = () => {
            hologramActive = false; hologramGroup.visible = false;
            hVideo.pause(); hVideo.currentTime = 0;
            hMat.uniforms.uPlaying.value = 0;
            document.getElementById('video-controls').style.display = 'none';
            document.getElementById('unmute-btn').classList.remove('visible');
            document.getElementById('onboarding').classList.add('visible');
            showStep(0);
        };

        function showStep(s) {
            const emoji = document.getElementById('step-emoji'), title = document.getElementById('step-title'), sub = document.getElementById('step-sub'), num = document.getElementById('step-num');
            if (s === 0) { emoji.textContent = '🖐️'; num.textContent = 'КРОК 1'; title.textContent = 'Покажіть долоню'; sub.textContent = 'Підніміть руку перед камерою'; }
            else if (s === 1) { emoji.textContent = '👌'; num.textContent = 'КРОК 2'; title.textContent = 'Жест OK'; sub.textContent = "З'єднайте великий та вказівний палець"; }
        }

        const pauseBtn = document.getElementById('pause-btn'), restartBtn = document.getElementById('restart-btn');
        const unmuteBtn = document.getElementById('unmute-btn');

        pauseBtn.onclick = () => { if (isPaused) { hVideo.play(); hMat.uniforms.uPlaying.value = 1; isPaused = false; pauseBtn.textContent = 'Пауза'; } else { hVideo.pause(); hMat.uniforms.uPlaying.value = 0; isPaused = true; pauseBtn.textContent = 'Продовжити'; } };
        restartBtn.onclick = () => { hVideo.currentTime = 0; hVideo.play(); hMat.uniforms.uPlaying.value = 1; isPaused = false; pauseBtn.textContent = 'Пауза'; };

        async function activateHologram() {
            if (hologramActive) return;
            hologramActive = true;
            hologramGroup.visible = true;
            document.getElementById('onboarding').classList.remove('visible');
            debugInfo.innerHTML = 'Голограма активована';

            hVideo.muted = false;
            try {
                await hVideo.play();
                hMat.uniforms.uPlaying.value = 1;
                document.getElementById('video-controls').style.display = 'flex';
                debugInfo.innerHTML = 'Відео + Звук';
                return;
            } catch(e) {
                hVideo.muted = true;
                await hVideo.play();
                hMat.uniforms.uPlaying.value = 1;
                document.getElementById('video-controls').style.display = 'flex';
                debugInfo.innerHTML = 'Відео (без звуку)';
                unmuteBtn.classList.add('visible');
            }
        }

        unmuteBtn.onclick = () => { hVideo.muted = false; unmuteBtn.classList.remove('visible'); debugInfo.innerHTML = 'Звук увімкнено'; };

        // FIX: якщо камери немає — одразу показуємо відео без трекінгу
        const camResult = await startCamera();
        if (!camResult.ok) {
            document.getElementById('loading').classList.remove('visible');
            activateWithoutCamera(camResult.reason);
            animate();
            return;
        }

        // Далі — з камерою: MediaPipe
        let handLandmarker = null;
        try {
            const { FilesetResolver, HandLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm');
            const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm');
            handLandmarker = await HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' }, runningMode: 'VIDEO', numHands: 1 });
        } catch(e) { console.warn('MediaPipe failed', e); }

        document.getElementById('loading').classList.remove('visible');
        document.getElementById('onboarding').classList.add('visible');
        showStep(0);

        let lastDetectTime = 0;
        function detectLoop() {
            requestAnimationFrame(detectLoop);
            // FIX: не зупиняємо трекінг після активації — рух за рукою продовжується
            if (!handLandmarker || videoEl.readyState < 2) return;
            const now = performance.now();
            if (now - lastDetectTime < 100) return;
            lastDetectTime = now;

            try {
                const res = handLandmarker.detectForVideo(videoEl, now);
                if (res.landmarks?.length > 0) {
                    const lm = res.landmarks[0];
                    const okD = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                    const palmSz = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) || 0.001;

                    if (!hologramActive && okD < palmSz * 0.5) {
                        activateHologram();
                    } else if (!hologramActive) {
                        showStep(1);
                    }

                    // FIX: рух голограми за рукою працює і після активації
                    const mir = facingMode === 'user', dir = mir ? -1 : 1;
                    hologramGroup.position.x += (dir * ((lm[0].x + lm[17].x)/2 * 2 - 1) - hologramGroup.position.x) * 0.1;
                    hologramGroup.position.y += ((0.5 - (lm[0].y + lm[17].y)/2) * 1.5 + 0.35 - hologramGroup.position.y) * 0.1;
                }
            } catch(e) {}
        }

        function animate() {
            requestAnimationFrame(animate);
            if (hologramGroup.visible) {
                const t = performance.now() / 1000;
                // FIX: оновлення однієї BufferGeometry замість 15 Mesh
                const posAttr = pGeo.attributes.position;
                for (let i = 0; i < particleCount; i++) {
                    const a = t * particles.userData.speeds[i] + particles.userData.angles[i];
                    const r = particles.userData.radii[i];
                    posAttr.setXYZ(i, Math.cos(a) * r, Math.sin(a * 2) * 0.05, Math.sin(a) * r);
                }
                posAttr.needsUpdate = true;
            }
            renderer.render(scene, cam3);
        }
        animate();
        detectLoop();
    }

    if (!params.video) initSetup();
    else initAR();
</script>
</body>
</html>
